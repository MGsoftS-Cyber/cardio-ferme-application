name: Build and migration checks
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet tool restore
      - run: dotnet restore src/Cardio.Practice --locked-mode
      - run: dotnet build src/Cardio.Practice --no-restore
      - run: dotnet ef migrations has-pending-model-changes --project src/Cardio.Practice --no-build
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check src/Cardio.Practice/wwwroot/app.js
